pitch: >-
  An open, bench-top machine that makes electrostatically charged melt-blown polypropylene web from standard resin on
  one 120 V, 15 A circuit: a desktop screw extruder and a gear melt pump feed a 40-hole slot die, hot air draws the
  melt into fibres of a few micrometres onto a traversing drum, and a corona bar charges the web. It makes filter
  media for testing, not masks or respirators.
problem: >-
  In COVID-19, respirator shortages came partly from scarce melt-blown polypropylene media: the resin is plentiful,
  but the lines and the know-how sit in a few large plants that take months to build. Maker spaces, universities and
  local manufacturers have no documented, buildable way to make and charge melt-blown media when supply fails.
budget_usd: 10000        # value-engineering target per machine, proposed, awaiting Amish (OPF-DEC-001 D5); estimate USD 14,075.15 (bom/bom.csv)
